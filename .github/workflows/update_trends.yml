name: Trends Ingestion & Live Signal Build

on:
  schedule:
    # Run every 6 hours automatically
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ingest Multi-Source Trends
        run: |
          python generate_feed.py

      - name: Commit and push updated trend snapshot
        run: |
          git config --global user.name "Trends Bot"
          git config --global user.email "trends-bot@users.noreply.github.com"
          git add docs/data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(radar): automated multi-source signal ingestion snapshot [skip ci]" && git push)
